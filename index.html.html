<!DOCTYPE html>
<html lang="en"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine Swati ❤️</title>

<style>
body{
    height:100vh;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
    overflow:hidden;
}

/* Floating hearts */
.heart{
    position:absolute;
    color:rgba(255,0,85,0.7);
    animation:float 6s linear infinite;
}
@keyframes float{
    from{transform:translateY(100vh);opacity:0;}
    20%{opacity:1;}
    to{transform:translateY(-10vh);opacity:0;}
}

/* Card */
.container{
    background:white;
    padding:45px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    z-index:10;
}

/* Typewriter */
#question{
    color:#ff4d6d;
    font-size:2.5rem;
    min-height:60px;
}

/* Buttons */
.buttons{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:40px;
}

button{
    padding:15px 40px;
    font-size:18px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    transition:transform .5s ease;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}
#yesBtn:hover{transform:scale(1.1);}

#noBtn{
    background:#adb5bd;
    color:black;
    position:relative;
}

.message{
    display:none;
    font-size:2rem;
    color:#ff4d6d;
    margin-top:25px;
}
</style>
</head>

<body>

<!-- Music -->
<audio autoplay loop>
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_5f8c06f9c2.mp3">
</audio>

<div class="container">

<h1 id="question"></h1>

<div class="buttons">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 💔</button>
</div>

<div class="message" id="message">
YAY, I knew it!! 💖💖💖
</div>

</div>

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* TYPEWRITER */
const text="Swati, will you be my Valentine? ❤️";
let i=0;
function typeWriter(){
  if(i<text.length){
    document.getElementById("question").innerHTML+=text.charAt(i);
    i++;
    setTimeout(typeWriter,80);
  }
}
typeWriter();

/* Floating Hearts */
function createHeart(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(Math.random()*20+15)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart,300);

/* NO Button Escape */
const noBtn=document.getElementById("noBtn");

noBtn.addEventListener("mouseenter",()=>{
  const x = (Math.random() * 800) - 400;
  const y = (Math.random() * 800) - 400;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
});

/* YES Click */
document.getElementById("yesBtn").addEventListener("click",()=>{
  document.getElementById("message").style.display="block";
  confetti({
    particleCount:200,
    spread:120,
    origin:{y:0.6}
  });
});
</script>

</body>
</html>
